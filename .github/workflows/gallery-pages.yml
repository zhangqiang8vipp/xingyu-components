name: Component Gallery (GitHub Pages)

on:
  push:
    branches: [main]
    paths:
      - "gallery/**"
      - "src/**"
      - "tests/gallery.test.mjs"
      - "package.json"
      - ".github/workflows/gallery-pages.yml"
  workflow_dispatch:

concurrency:
  group: component-gallery-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      pages: read
    outputs:
      pages_enabled: ${{ steps.pages-status.outputs.enabled }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build gallery and run the full test suite
        run: npm run ci
      - name: Upload downloadable static preview
        uses: actions/upload-artifact@v4
        with:
          name: xingyu-components-gallery
          path: gallery-dist/
          include-hidden-files: true
          retention-days: 14
      - name: Check whether GitHub Pages is enabled
        id: pages-status
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          status="$(curl --silent --show-error --location --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pages")"
          if [ "${status}" = "200" ]; then
            echo "enabled=true" >> "${GITHUB_OUTPUT}"
          else
            echo "enabled=false" >> "${GITHUB_OUTPUT}"
            echo "::notice::GitHub Pages is not ready (HTTP ${status}). Enable Settings > Pages > Source: GitHub Actions, then re-run this workflow manually. Static preview artifact was still uploaded."
          fi
      - name: Configure GitHub Pages
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/configure-pages@v5
      - name: Upload GitHub Pages artifact
        if: steps.pages-status.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: gallery-dist/

  deploy:
    if: needs.build.outputs.pages_enabled == 'true'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish component gallery
        id: deployment
        uses: actions/deploy-pages@v4
